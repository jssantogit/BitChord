# The app targets SDK 36 but the pinned Robolectric only supports through 35.
# Resource-backed unit tests use the merged Android manifest, so pin the SDK
# instead of failing other existing Room integration tests at initialization.
sdk=35
# The production Application installs Android playback hooks/Java 21 third-party classes.
# JVM tests need a neutral Application, as they had with Robolectric's no-resource manifest.
application=android.app.Application
