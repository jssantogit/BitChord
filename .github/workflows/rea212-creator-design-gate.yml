name: REA 212 · Playlist Creator Android Test Gate

on:
  push:
    branches:
      - validation/rea212-creator-design-b691aafa-20261113
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea212-creator-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-test:
    name: Android unit + shared UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact validation source
        uses: actions/checkout@v4
      - name: Assert underlying PR revision
        run: |
          test "$(git rev-parse HEAD^)" = "b691aafa93da477537c6a2af0a3aee2a317c5e4e"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure unit tests
        run: |
          printf 'LASTFM_API_KEY=%s\n' "" > local.properties
          printf 'LASTFM_SECRET=%s\n' "" >> local.properties
          chmod +x gradlew
      - name: Android app regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared native interface regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
