name: "Catalog #211 — Typed Master exact-edition pair matrix"

# Source-only B leads from real public RG->Master relations. No token,
# APK, UI, merge, provider priority switch or corpus approval.
on:
  push:
    branches:
      - catalog/210-discogs-provider-evidence-20261107
    paths:
      - scripts/catalog_211_discogs_master_pair_matrix.py
      - scripts/test_catalog_211_discogs_master_pair_matrix.py
      - scripts/catalog_211_discogs_master_lead_scout.py
      - .github/workflows/catalog-211-discogs-master-pairs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-211-master-pairs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-all-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact source IDs, bounded cross-product and fail-closed regressions
        run: python3 -m unittest discover -s scripts -p 'test_catalog_211_discogs_master_pair_matrix.py' -v
      - name: Recheck both exact typed Masters with complete version lists
        run: python3 scripts/catalog_211_discogs_master_pair_matrix.py --target all
      - name: Summarize every observed pair without a matching verdict or new requests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path("discogs-211-typed-master-pair-matrix.json").read_text())
          for finding in obj["findings"]:
              print("Artist:", finding["artist"], "status:", finding["status"])
              for pair in finding["pairs"]:
                  c = pair["comparison"]
                  print(json.dumps({
                      "musicbrainz": pair["musicbrainz_release_mbid"],
                      "discogs": pair["discogs_release_id"],
                      "direct_release_relation": pair["direct_release_relation"],
                      "tracks": [c["exact_matching_track_positions"],
                                 c["track_count"], c["discogs_track_count"]],
                      "full_tracks": c["tracklist_matches"],
                      "barcode_same": c["barcode_identical_on_both"],
                      "country_compatible": c["country_compatible"],
                      "year_matches": c["year_matches"],
                      "mb_formats": pair["mb_formats"],
                      "discogs_formats": pair["discogs_formats"],
                      "label_catalog_status": pair["label_catalog"]["assessment"],
                      "matching_label_catalog": pair["label_catalog"]["matching_pairs"],
                      "conflicting_same_label_catalog": pair["label_catalog"]["conflicting_same_label_catalog_numbers"],
                      "verified": False,
                  }, ensure_ascii=False))
          PY
      - name: Retain non-adjudicated pair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discogs-211-two-typed-master-matrices
          path: discogs-211-typed-master-pair-matrix.json
          if-no-files-found: warn
          retention-days: 7
