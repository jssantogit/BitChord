name: Perf playback instrumentation helper

on:
  push:
    branches:
      - perf/runtime-performance-probes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/runtime-performance-probes

      - name: Apply exact playback instrumentation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/music/bitchord/playback/PlaybackService.kt")
          source = path.read_text()

          factory_before = ") { lastPublishedSubtitle }\n"
          factory_after = ") { lastPublishedSubtitle }.withPlaybackPerformanceProbes()\n"
          factory_count = source.count(factory_before)
          if factory_count != 1:
              raise SystemExit(f"expected exactly one session-player factory seam, found {factory_count}")
          source = source.replace(factory_before, factory_after, 1)

          transition_before = """    private fun onTrackBecameCurrent(
              mediaItem: MediaItem?,
              previousEnded: Boolean,
              reason: Int,
              alreadyAudible: Boolean = false,
          ) {
              val exoPlayer = player ?: return
          """
          transition_after = """    private fun onTrackBecameCurrent(
              mediaItem: MediaItem?,
              previousEnded: Boolean,
              reason: Int,
              alreadyAudible: Boolean = false,
          ) = PlaybackPerformance.measure(PlaybackPerformanceOperation.TRACK_TRANSITION) {
              val exoPlayer = player ?: return@measure
          """
          transition_count = source.count(transition_before)
          if transition_count != 1:
              raise SystemExit(f"expected exactly one track-transition seam, found {transition_count}")
          source = source.replace(transition_before, transition_after, 1)

          path.write_text(source)
          PY

      - name: Remove helper workflow
        run: git rm .github/workflows/perf-playback-instrumentation-helper.yml

      - name: Commit targeted patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/playback/PlaybackService.kt
          git commit -m "feat(perf): wire bounded playback lifecycle probes"
          git push origin HEAD:perf/runtime-performance-probes
