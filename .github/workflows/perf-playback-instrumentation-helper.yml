name: Perf playback instrumentation helper

on:
  push:
    branches:
      - perf/runtime-performance-probes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/runtime-performance-probes

      - name: Apply exact playback instrumentation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/music/bitchord/playback/PlaybackService.kt")
          source = path.read_text()

          factory_before = ") { lastPublishedSubtitle }\n"
          factory_after = ") { lastPublishedSubtitle }.withPlaybackPerformanceProbes()\n"
          factory_count = source.count(factory_before)
          if factory_count != 1:
              raise SystemExit(f"expected exactly one session-player factory seam, found {factory_count}")
          source = source.replace(factory_before, factory_after, 1)

          function_marker = "    private fun onTrackBecameCurrent("
          if source.count(function_marker) != 1:
              raise SystemExit(f"expected exactly one track-transition function, found {source.count(function_marker)}")
          function_start = source.index(function_marker)
          transition_before = "    ) {\n        val exoPlayer = player ?: return\n"
          transition_at = source.find(transition_before, function_start)
          next_function = source.find("\n    private fun ", function_start + len(function_marker))
          if transition_at < 0 or (next_function >= 0 and transition_at > next_function):
              raise SystemExit("track-transition body seam not found inside onTrackBecameCurrent")
          transition_after = "    ) = PlaybackPerformance.measure(PlaybackPerformanceOperation.TRACK_TRANSITION) {\n        val exoPlayer = player ?: return@measure\n"
          source = source[:transition_at] + transition_after + source[transition_at + len(transition_before):]

          path.write_text(source)
          PY

      - name: Remove helper workflow
        run: git rm .github/workflows/perf-playback-instrumentation-helper.yml

      - name: Commit targeted patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/playback/PlaybackService.kt
          git commit -m "feat(perf): wire bounded playback lifecycle probes"
          git push origin HEAD:perf/runtime-performance-probes
