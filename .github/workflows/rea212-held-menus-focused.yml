# Prove the exact new retained-menu source and its focused Compose/policy tests.
# Separate from conflicting #209; no APK or merge.
name: REA 212 · Native held-menu focused regression

on:
  push:
    branches: [validation/rea212-held-menus-2af7a3e7-20261113]
    paths: [.github/workflows/rea212-held-menus-focused.yml]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR 212 source
        uses: actions/checkout@v4
        with:
          ref: 2af7a3e71ad486177096424d247872577ab5e807
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "2af7a3e71ad486177096424d247872577ab5e807"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure tests
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Focused Android Compose and policy regressions
        run: |
          ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest \
            --tests "com.music.bitchord.ui.screens.SmartPlaylistSavedFilterHeldMenuTest" \
            --tests "com.music.bitchord.ui.screens.CanonicalLibraryHeldContextMenuPolicyTest" \
            --tests "com.music.bitchord.LibraryPlaylistHeldMenuPolicyTest"
      - name: Retain failure reports only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-native-held-menu-focused-failures
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
