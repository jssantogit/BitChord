# Exact-source Android and shared UI regression, no APK/merge.
name: REA 212 · Verified player Open Album regression

on:
  push:
    branches: [validation/rea212-open-player-album-43fc7cb4-20261113]
    paths: [.github/workflows/rea212-player-album-test-only.yml]

permissions:
  contents: read

jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR 212 source
        uses: actions/checkout@v4
        with:
          ref: 43fc7cb4d314b728f3d827c41d8a23d4686f9a3a
      - name: Assert source SHA
        run: test "$(git rev-parse HEAD)" = "43fc7cb4d314b728f3d827c41d8a23d4686f9a3a"
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure unit test build
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Android app unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared native UI tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-player-album-failed-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
