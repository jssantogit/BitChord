name: Catalog #211 — Discogs editorial corpus checks

on:
  push:
    branches:
      - catalog/210-discogs-provider-evidence-20261107
    paths:
      - scripts/catalog_211_discogs_corpus_report.py
      - scripts/test_catalog_211_discogs_corpus_report.py
      - scripts/catalog_211_discogs_primary_baseline.py
      - scripts/test_catalog_211_discogs_primary_baseline.py
      - docs/plans/catalog-211-discogs-first-feasibility.md
      - app/src/main/java/com/music/bitchord/data/catalog/metadata/discogs/DiscogsPublicArtistDiscovery.kt
      - app/src/main/java/com/music/bitchord/data/catalog/metadata/discogs/DiscogsCanonicalEditionCoordinator.kt
      - app/src/main/java/com/music/bitchord/data/catalog/metadata/MusicBrainzCatalogGraph.kt
      - app/src/main/java/com/music/bitchord/data/catalog/metadata/CanonicalProviderEnrichmentPolicy.kt
      - docs/plans/catalog-211-discogs-corpus-manifest.json
      - .github/workflows/catalog-211-discogs-corpus.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pure offline corpus regression tests
        run: python3 -m unittest discover -s scripts -p 'test_catalog_211_discogs_corpus_report.py' -v
      - name: Test read-only Discogs-first feasibility baseline
        run: python3 -m unittest discover -s scripts -p 'test_catalog_211_discogs_primary_baseline.py' -v
      - name: Publish proposal-only primary provider baseline
        run: python3 scripts/catalog_211_discogs_primary_baseline.py --output discogs-211-primary-feasibility.json
      - name: Assert unreviewed manifest does not make coverage claims
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from catalog_211_discogs_corpus_report import report
          manifest = json.loads(Path("docs/plans/catalog-211-discogs-corpus-manifest.json").read_text())
          result = report(manifest)
          assert not result["complete"], "Unreviewed cases must never count as measured coverage"
          assert result["metrics"] is None, "No metric may be invented before adjudication"
          assert len(manifest["cases"]) == 30
          assert not result["errors"], result["errors"]
          assert result["slots"]["unlinked"]["selected_unreviewed"] == 0
          assert result["slots"]["source_only"]["selected_unreviewed"] == 3
          assert result["slots"]["unlinked"]["reviewed"] == 7
          print("30 slots: 7 independently source-reviewed B pairs, none Verified,"
                " 3 preliminary excluded C leads; no global coverage metrics.")
          PY
      - name: Retain feasibility baseline for operator review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discogs-211-primary-feasibility
          path: discogs-211-primary-feasibility.json
          if-no-files-found: warn
          retention-days: 7
