name: Android Physical Smoke APK

# An APK is prepared only when someone explicitly schedules a physical smoke.
# The main Android CI remains test-only and keeps its required status context.
on:
  # One explicitly authorized APK request for smart playlists #192.
  # This scoped push fallback is needed while PR #193 has a conflicted merge
  # ref and the connected GitHub integration cannot dispatch workflows.
  push:
    branches: [listening/smart-playlists-v2-192]
    paths: [docs/listening/issue-192-physical-smoke-request.md]
  workflow_dispatch:
    inputs:
      smoke_plan:
        description: 'Approved physical smoke scenario or issue reference'
        required: true
        type: string

concurrency:
  group: android-physical-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-smoke-apk:
    name: Android · physical smoke APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate physical smoke request
        env:
          SMOKE_PLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_plan || (github.event_name == 'push' && github.ref == 'refs/heads/listening/smart-playlists-v2-192' && 'Explicit user-approved physical smoke for issue 192') }}
        run: test -n "$SMOKE_PLAN"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest

      - name: Build dev smoke APK
        run: ./gradlew -Pbitchord.bundleWear=false :app:assembleDevDebug

      - name: Upload dev smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-physical-smoke-dev-debug-${{ github.sha }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
