# Exact draft PR 212 source after migrating tests for user-approved direct
# rating cancellation and the native Playlist track overflow.
# No APK, merge or production publication.
name: REA 212 · Seven-point UI after test migration

on:
  push:
    branches: [validation/rea212-seven-after-testfix-4f621934-20261113]
    paths: [.github/workflows/rea212-seven-after-testfix.yml]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: 4f6219347294f1f3af8385b3e9c86fb39f094de7
      - name: Verify exact commit
        run: test "$(git rev-parse HEAD)" = "4f6219347294f1f3af8385b3e9c86fb39f094de7"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Android app unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared native UI tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Retain failed reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-seven-test-migration-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
