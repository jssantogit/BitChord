name: REA 212 · Root tab motion Android gate

on:
  push:
    branches:
      - validation/rea212-root-tab-motion-20261113
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea212-root-tab-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    name: Android + shared UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout pinned validation source
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Assert exact PR source
        run: |
          git diff --exit-code 23cea2d507ae88f1c546a31a0a4244b15511da16 HEAD -- app sharedUi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Android test environment
        run: |
          printf 'LASTFM_API_KEY=%s\n' "" > local.properties
          printf 'LASTFM_SECRET=%s\n' "" >> local.properties
          chmod +x gradlew
      - name: Android app regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
