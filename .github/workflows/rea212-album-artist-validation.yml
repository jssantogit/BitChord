name: REA212 Album and artist actions validation
on:
  push:
    branches: [validation/rea212-release-artist-actions-62dbfa99-20261114]
permissions:
  contents: read
jobs:
  android-and-shared-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Ensure production and test sources equal PR HEAD
        run: |
          set -euo pipefail
          git diff --exit-code 62dbfa99d412d1a503aae86f12b18889cf2bcbe8 HEAD -- app sharedUi shared
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure local properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Album and artist focused tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests "com.music.bitchord.ui.screens.NativeAlbumHeroActionsTest" --tests "com.music.bitchord.ui.screens.NativeArtistReleaseHoldTest" --tests "com.music.bitchord.ui.screens.NativePlaylistHeroActionsTest"
      - name: Android complete unit suite
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI JVM tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Shared Automix regression
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :shared:jvmTest --tests "com.music.bitchord.playback.smart.AdvancedAutomixPlannerTest"
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-album-artist-unit-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
