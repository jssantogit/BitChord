# One-time, user-requested APK smoke from the exact green PR #212 head.
# Keep this off PR #212; no merge, no production signing or publishing.
name: REA 212 · Green HEAD devDebug smoke APK

on:
  push:
    branches:
      - smoke/rea212-4306e20e-20261112
    paths:
      - .github/workflows/rea212-green-head-smoke-apk.yml

permissions:
  contents: read

concurrency:
  group: rea212-green-head-4306e20e
  cancel-in-progress: false

jobs:
  devdebug:
    name: Build validated #212 universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact CI-green PR #212 commit, not upstream or merge ref
        uses: actions/checkout@v4
        with:
          ref: 4306e20e27f8448de7cdcb7386c6503383787f0b
      - name: Assert source identity before build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4306e20e27f8448de7cdcb7386c6503383787f0b"
          printf 'PR=212\nsource_sha=%s\nandroid_ci=43322584529\n' "$(git rev-parse HEAD)" > smoke-provenance.txt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Android dev build
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Assemble devDebug universal APK
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:assembleDevDebug
      - name: Verify universal APK and compute checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-apk
          universal="$(find app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          if [[ -z "$universal" ]]; then
            echo "::error::Universal APK missing"
            exit 1
          fi
          cp "$universal" smoke-apk/BitChord-AppleMusic-212-4306e20e-universal.apk
          cp smoke-provenance.txt smoke-apk/BUILD_PROVENANCE.txt
          (cd smoke-apk && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload short-lived smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-212-devDebug-4306e20e
          path: smoke-apk/
          if-no-files-found: error
          retention-days: 7
