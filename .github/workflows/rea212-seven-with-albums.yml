# User-driven seven UI fixes, playlist and Library Open album coverage.
# Test-only pin of exact branch source; never publishes an APK or merges.
name: REA 212 · Seven UI fixes and verified album routes

on:
  push:
    branches: [validation/rea212-seven-with-albums-7c322499-20261113]
    paths: [.github/workflows/rea212-seven-with-albums.yml]

permissions:
  contents: read

jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source SHA
        uses: actions/checkout@v4
        with:
          ref: 7c32249918435f89d10d78ad0b9c760fe0b9d0bd
      - name: Validate exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "7c32249918435f89d10d78ad0b9c760fe0b9d0bd"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit test local properties
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Android unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-seven-album-regression-failures
          path: app/build/reports/tests/
          retention-days: 3
          if-no-files-found: ignore
