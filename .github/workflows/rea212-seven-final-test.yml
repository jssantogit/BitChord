# Exact user-screenshot regression source: seven UI fixes, album navigation,
# native menus, blur/source suppression, and measured top-bar popup anchors.
# Test-only, no APK or PR merge.
name: REA 212 · Seven screenshot fixes final Android and UI tests

on:
  push:
    branches: [validation/rea212-seven-final-604d89b8-20261113]
    paths: [.github/workflows/rea212-seven-final-test.yml]

permissions:
  contents: read

jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact draft source
        uses: actions/checkout@v4
        with:
          ref: 604d89b88a015094aae9224f87fb9110c66fd072
      - name: Assert exact SHA
        run: test "$(git rev-parse HEAD)" = "604d89b88a015094aae9224f87fb9110c66fd072"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure local properties
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Android app regression tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared native UI regression tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Retain reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-seven-final-failed-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
