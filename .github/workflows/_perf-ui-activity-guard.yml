name: Perf UI diagnostics guard helper

on:
  push:
    branches:
      - perf/runtime-performance-probes
    paths:
      - .github/workflows/_perf-ui-activity-guard.yml

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/runtime-performance-probes
          fetch-depth: 0
      - name: Guard diagnostics-only Compose effects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          artwork = "sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/ArtworkMeshBackdrop.kt"
          replace_once(artwork, "    SideEffect {\n        RuntimePerformanceUiContext.record(RuntimePerformanceUiSignal.ARTWORK_BACKDROP_RECOMPOSITION)\n    }\n    LaunchedEffect(canBlur) {\n        RuntimePerformanceUiContext.setState(\n            RuntimePerformanceUiStateKey.DYNAMIC_BLUR,\n            if (canBlur) RuntimePerformanceUiStateValue.ENABLED else RuntimePerformanceUiStateValue.REDUCED,\n        )\n    }\n", "    if (RuntimePerformanceUiContext.enabled) {\n        SideEffect {\n            RuntimePerformanceUiContext.record(RuntimePerformanceUiSignal.ARTWORK_BACKDROP_RECOMPOSITION)\n        }\n        LaunchedEffect(canBlur) {\n            RuntimePerformanceUiContext.setState(\n                RuntimePerformanceUiStateKey.DYNAMIC_BLUR,\n                if (canBlur) RuntimePerformanceUiStateValue.ENABLED else RuntimePerformanceUiStateValue.REDUCED,\n            )\n        }\n    }\n")

          now_playing = "sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/NowPlayingScreen.kt"
          replace_once(now_playing, "    SideEffect {\n        RuntimePerformanceUiContext.record(RuntimePerformanceUiSignal.NOW_PLAYING_RECOMPOSITION)\n    }\n", "    if (RuntimePerformanceUiContext.enabled) {\n        SideEffect {\n            RuntimePerformanceUiContext.record(RuntimePerformanceUiSignal.NOW_PLAYING_RECOMPOSITION)\n        }\n    }\n")
          replace_once(now_playing, "    LaunchedEffect(canvasRendered) {\n        RuntimePerformanceUiContext.setState(\n            RuntimePerformanceUiStateKey.CANVAS_MODE,\n            if (canvasRendered) RuntimePerformanceUiStateValue.ACTIVE else RuntimePerformanceUiStateValue.INACTIVE,\n        )\n    }\n    DisposableEffect(Unit) {\n        onDispose {\n            RuntimePerformanceUiContext.setState(\n                RuntimePerformanceUiStateKey.CANVAS_MODE,\n                RuntimePerformanceUiStateValue.INACTIVE,\n            )\n        }\n    }\n", "    if (RuntimePerformanceUiContext.enabled) {\n        LaunchedEffect(canvasRendered) {\n            RuntimePerformanceUiContext.setState(\n                RuntimePerformanceUiStateKey.CANVAS_MODE,\n                if (canvasRendered) RuntimePerformanceUiStateValue.ACTIVE else RuntimePerformanceUiStateValue.INACTIVE,\n            )\n        }\n        DisposableEffect(Unit) {\n            onDispose {\n                RuntimePerformanceUiContext.setState(\n                    RuntimePerformanceUiStateKey.CANVAS_MODE,\n                    RuntimePerformanceUiStateValue.INACTIVE,\n                )\n            }\n        }\n    }\n")

          Path(".github/workflows/_perf-ui-activity-guard.yml").unlink()
          PY
      - name: Commit guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(perf): avoid release-only diagnostics effects"
          git push origin HEAD:perf/runtime-performance-probes
