name: AMS · namespace-normalized Aria reconciliation
on:
  push:
    branches: [audit/ams-aria-identity-resolved-navigation-20261128]
  pull_request:
    branches: [audit/ams-aria-identity-resolved-core-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Normalize ancestor and AMS identically; retain exact MAIN tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aria reconciliation diagnostic"
          git config user.email "diagnostic@users.noreply.github.com"
          git config merge.renameLimit 10000
          git config diff.renameLimit 10000
          mkdir -p /tmp/aria-normalized
          cp scripts/ams-normalize-namespace-diagnostic.py /tmp/ams-normalize.py
          cp scripts/ams-resolve-core-identity-diagnostic.py /tmp/ams-resolve-core.py
          test "$(git merge-base da8889af614ec28c9ffb0bd3e1b055657adb45b6 58d8d9143fa04302cb3356df510e77c76a2eae57)" = "9513793560f583f5d7cdd4f97e14a5a5ad7f9cfa"
          for pair in base:9513793560f583f5d7cdd4f97e14a5a5ad7f9cfa ams:da8889af614ec28c9ffb0bd3e1b055657adb45b6; do
            label="${pair%%:*}"
            sha="${pair#*:}"
            git worktree add --detach "/tmp/aria-$label" "$sha"
            python3 /tmp/ams-normalize.py "/tmp/aria-$label"
            git -C "/tmp/aria-$label" add -A
            git -C "/tmp/aria-$label" write-tree > "/tmp/aria-normalized/$label-tree"
          done
          BASE=$(git commit-tree "$(cat /tmp/aria-normalized/base-tree)" -m "Synthetic normalized ancestor")
          AMS=$(git commit-tree "$(cat /tmp/aria-normalized/ams-tree)" -p "$BASE" -m "Synthetic normalized AMS")
          MAIN=$(git commit-tree "$(git rev-parse 58d8d9143fa04302cb3356df510e77c76a2eae57^{tree})" -p "$BASE" -m "Synthetic exact MAIN")
          printf '%s\n' "$BASE" "$AMS" "$MAIN" > /tmp/aria-normalized/synthetic-commits.txt
          git switch --detach "$AMS"
          set +e
          git merge --no-commit --no-ff "$MAIN" > /tmp/aria-normalized/merge.log 2>&1
          result=$?
          set -e
          # Reviewed identity-only resolutions: preserve the newer AMS/IDM
          # copy, change only product name, and respect MAIN's Desktop removal.
          for file in app/src/main/res/values-pt/acquisition_destination.xml app/src/main/res/values/acquisition_destination.xml app/src/main/res/values/strings_opensubsonic.xml; do
            test -n "$(git ls-files -u -- "$file")"
            git show ":2:$file" > "$file"
            python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          source=p.read_text()
          assert "BitChord" in source
          p.write_text(source.replace("BitChord","Aria"))
          PY
            git add "$file"
            echo "RESOLVED_TEXT|$file"
          done
          desktop=desktopApp/src/main/kotlin/com/music/aria/desktop/DesktopApp.kt
          test -n "$(git ls-files -u -- "$desktop")"
          if git cat-file -e "$MAIN:$desktop" 2>/dev/null; then
            echo "::error::MAIN Desktop deletion no longer holds"; exit 1
          fi
          git rm -f -- "$desktop"
          echo "RESOLVED_REMOVED_PLATFORM|$desktop"
          python3 /tmp/ams-resolve-core.py
          python3 - <<'PY'
          # Reconcile final navigation hunks against the same frozen trees.
          import re
          from pathlib import Path
          import subprocess
          APP="app/src/main/java/com/music/aria/"
          PAT=re.compile(r"^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]+\n", re.M|re.S)
          def resolve(path, decisions):
              p=Path(path); raw=p.read_text()
              assert len(list(PAT.finditer(raw)))==len(decisions),path
              def select(m):
                  left,right=m.groups()
                  expected,fn=next(it)
                  assert expected in left+right,(path,expected)
                  return fn(left,right)
              it=iter(decisions)
              result=PAT.sub(select,raw)
              assert "<<<<<<< HEAD" not in result,path
              p.write_text(result)
              subprocess.run(["git","add","--",path],check=True)
              print("RESOLVED_NAVIGATION|"+path)
          ours=lambda a,b:a
          theirs=lambda a,b:b
          def remove_wear(a,b):
              return "".join(line for line in a.splitlines(keepends=True) if "var showWearOs " not in line)
          def remove_selector(a,b):
              return "".join(line for line in a.splitlines(keepends=True) if "var showAccountSelector " not in line)
          def palette(a,b):
              return a.replace(" && !showWearOs","")
          def scrolled(a,b):
              return a.replace(" || showWearOs","")
          def welcome(a,b):
              # Keep extracted composable to avoid the Android JVM method-size regression.
              assert "fun LegacyFullWindowOverlays()" in a
              prefix=a[:a.index("            WelcomeOnboardingOverlay(")]
              return prefix+"            WelcomeOnboardingOverlay(visibleState = onboardingShown)\n"
          def folder_and_language(a,b):
              # Keep folder and recent-additions menus; take MAIN's language entry.
              assert "UnifiedLibraryMenus(" in a and "LanguageSettingsOverlays(" in b
              assert b.lstrip().startswith("}")
              call=b[b.index("        LanguageSettingsOverlays("):]
              return a+"".join("    "+line for line in call.splitlines(keepends=True))
          resolve(APP+"MainActivity.kt",[
              ("showAccountScrobbling",remove_wear),
              ("librarySortMenuOpen",remove_selector),
              ("onAccountScrobbling",theirs),
              ("onSoulseek",theirs),
              ("appleDetailPalette",palette),
              ("amsAlbumChartChrome",scrolled),
              ("LegacyFullWindowOverlays",welcome),
              ("UnifiedLibraryMenus",folder_and_language),
          ])
          resolve(APP+"ui/screens/SettingsNavigation.kt",[
              ("onListenTogether",theirs),
          ])
          resolve(APP+"ui/screens/SettingsSheet.kt",[
              ("onAccountScrobbling",theirs),
              ("onSoulseek",theirs),
              ("showWear",theirs),
              ("SettingsSection.ACCOUNT",theirs),
          ])
          # MAIN retired Google account selection; extraction preserved the old
          # block outside the conflict. Remove it and retain just one language overlay.
          p=Path(APP+"MainActivity.kt")
          s=p.read_text()
          start=s.index("            if (showAccountSelector) {")
          end=s.index("            LanguageSettingsOverlays(",start)
          assert "AccountProfileSelector(" in s[start:end] and "viewModel.removeAccount" in s[start:end]
          s=s[:start]+s[end:]
          pat=re.compile(r"^            LanguageSettingsOverlays\(\n.*?^            \)\n",re.M|re.S)
          calls=list(pat.finditer(s))
          assert len(calls)==2 and calls[0].group()==calls[1].group(), "unexpected language overlay duplication"
          s=s[:calls[0].start()]+s[calls[0].end():]
          s,n=re.subn(r"^    (?:val (?:showWearOs|showAccountSelector): [^\n]+|(?:showWearOs|showAccountSelector) = remember[^\n]+)\n","",s,flags=re.M)
          assert n==4,n
          assert not re.search(r"\b(?:showWearOs|showAccountSelector|AccountProfileSelector)\b",s)
          # Fix only reported whitespace, not unrelated formatting.
          needle="enabled = detail != null && !showSettings && !showAccountScrobbling && !showSources && !showListenTogether && "
          assert s.count(needle+"\n")==1
          s=s.replace(needle+"\n",needle.rstrip()+"\n")
          p.write_text(s)
          readme=Path("README.md")
          old=readme.read_text()
          assert old.endswith("\n\n")
          readme.write_text(old.rstrip("\n")+"\n")
          subprocess.run(["git","add","--",str(p),str(readme)],check=True)
          print("RESOLVED_RESIDUAL_NAVIGATION_AND_WHITESPACE")
          # Report remaining references for semantic review; a clean index is not a build.
          report=Path("/tmp/aria-normalized/navigation-review.txt")
          out=[]
          for name in ["MainActivity.kt","ui/screens/SettingsNavigation.kt","ui/screens/SettingsSheet.kt"]:
              lines=Path(APP+name).read_text().splitlines()
              out.append("=== "+name+" ===")
              pattern=re.compile(r"showWearOs|showAccountSelector|WearBridge|WatchInstaller|SettingsSection\.WEAR|onWearOs|AccountProfileSelector|LegacyFullWindowOverlays|LanguageSettingsOverlays|WelcomeOnboardingOverlay|onAccountScrobbling|onSoulseek|onListenTogether|appleDetailPalette")
              selected=set()
              for i,line in enumerate(lines):
                  if pattern.search(line):
                      selected.update(range(max(0,i-2),min(len(lines),i+3)))
              out.extend(f"{i+1}: {lines[i]}" for i in sorted(selected))
          report.write_text("\n".join(out)+"\n")
          print(report.read_text())
          PY
          git diff --name-only --diff-filter=U > /tmp/aria-normalized/conflicts.txt
          if [ ! -s /tmp/aria-normalized/conflicts.txt ]; then result=0; fi
          git ls-files -u > /tmp/aria-normalized/conflict-stages.tsv
          git status --short > /tmp/aria-normalized/status.txt
          printf 'merge_exit=%s\nconflicts=%s\n' "$result" "$(wc -l < /tmp/aria-normalized/conflicts.txt)" | tee /tmp/aria-normalized/summary.txt
          cat /tmp/aria-normalized/summary.txt >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          paths=Path("/tmp/aria-normalized/conflicts.txt").read_text().splitlines()
          counts=Counter("/".join(p.split("/")[:2]) for p in paths)
          for group,count in counts.most_common(): print(f"CONFLICT_GROUP|{group}|{count}")
          for path in paths: print(f"CONFLICT_PATH|{path}")
          PY
          if [ "$result" -eq 0 ]; then
            git write-tree | tee /tmp/aria-normalized/candidate-tree.txt
            git diff --cached --stat > /tmp/aria-normalized/candidate-stat.txt
          else
            # Capture every actual conflict hunk and stage status, not entire
            # source files. A successful diagnostic is not a successful merge.
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          report=Path("/tmp/aria-normalized")
          paths=(report/"conflicts.txt").read_text().splitlines()
          out=[]
          for name in paths:
              p=Path(name)
              stages=subprocess.check_output(["git","ls-files","-u","--",name],text=True)
              out.append("=== "+name+" ===\n"+stages)
              if not p.is_file(): continue
              text=p.read_text(errors="replace").splitlines()
              inside=False
              for line in text:
                  if line.startswith("<<<<<<<"): inside=True
                  if inside: out.append(line)
                  if line.startswith(">>>>>>>"): inside=False
          payload="\n".join(out)
          (report/"conflict-hunks.txt").write_text(payload)
          print(payload)
          PY
            echo "::notice::Remaining conflicts need semantic reconciliation; no production changes"
          fi
      - name: Require conflict-free candidate and compile Android
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/aria-normalized/candidate-tree.txt
          test ! -s /tmp/aria-normalized/conflicts.txt
          test -z "$(git ls-files -u)"
          git diff --cached --check
          chmod +x gradlew
          ./gradlew :app:compileDevDebugKotlin :app:compileDevDebugUnitTestKotlin --stacktrace
      - name: AMS Android contracts on reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDevDebugUnitTest \
            --tests 'com.music.aria.AppleMusicWebNativeCatalogSessionTest' \
            --tests 'com.music.aria.AppleMusicWebSearchUiSessionTest' \
            --tests 'com.music.aria.AmsDetailPreviewProjectionTest' \
            --tests 'com.music.aria.playback.AmsPreviewResolverTest' \
            --tests 'com.music.aria.AmsPhysicalSmokePolicyTest' \
            --tests 'com.music.aria.NativeTopBarRouteOwnerTest' \
            --tests 'com.music.aria.HomeSettingsOverflowAlignmentTest' \
            --tests 'com.music.aria.ui.screens.AmsVisualParityPolicyTest'
      - name: Full Android unit suite on the reconciled candidate
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDevDebugUnitTest --stacktrace
      - name: Export verified candidate with original history
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tree=$(git write-tree)
          test "$tree" = "$(cat /tmp/aria-normalized/candidate-tree.txt)"
          test "$tree" = "0cc14e1060d8e41feb0ed80ba0c175a87ada04db"
          ams=da8889af614ec28c9ffb0bd3e1b055657adb45b6
          main=58d8d9143fa04302cb3356df510e77c76a2eae57
          candidate=$(git commit-tree "$tree" -p "$ams" -p "$main" -m "Reconcile AMS with Aria Android identity")
          git update-ref refs/heads/ams-reconciled-export "$candidate"
          git bundle create /tmp/aria-normalized/candidate.bundle refs/heads/ams-reconciled-export "^$ams" "^$main"
          printf '%s\n' "$candidate" > /tmp/aria-normalized/candidate-commit.txt
      - name: Collect contract reports
        if: always()
        shell: bash
        run: |
          if [ -d app/build/test-results/testDevDebugUnitTest ]; then
            cp -r app/build/test-results/testDevDebugUnitTest /tmp/aria-normalized/android-contracts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-aria-normalized-${{ github.sha }}
          path: /tmp/aria-normalized/
          if-no-files-found: error
          retention-days: 7

  publish-isolated-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/audit/ams-aria-identity-resolved-navigation-20261128' && github.repository == 'jssantogit/Aria'
    needs: reconcile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ams-aria-normalized-${{ github.sha }}
          path: /tmp/aria-candidate
      - name: Publish only the verified isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(cat /tmp/aria-candidate/candidate-commit.txt)
          git bundle verify /tmp/aria-candidate/candidate.bundle
          git fetch /tmp/aria-candidate/candidate.bundle refs/heads/ams-reconciled-export
          test "$(git rev-parse FETCH_HEAD)" = "$candidate"
          test "$(git rev-parse "$candidate^{tree}")" = "0cc14e1060d8e41feb0ed80ba0c175a87ada04db"
          test "$(git show -s --format=%P "$candidate")" = "da8889af614ec28c9ffb0bd3e1b055657adb45b6 58d8d9143fa04302cb3356df510e77c76a2eae57"
          target=refs/heads/audit/ams-aria-reconciled-candidate-20261128
          existing=$(git ls-remote origin "$target" | cut -f1)
          if [ -n "$existing" ]; then
            test "$existing" = "$candidate"
          else
            git push origin "$candidate:$target"
          fi
          echo "Published isolated candidate $candidate" >> "$GITHUB_STEP_SUMMARY"
