name: REA212 artist backdrop and final Android validation
on:
  push:
    branches: [validation/rea212-artist-backdrop-4802b78-20261114]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Verify exact production and test sources
        run: |
          set -euo pipefail
          git diff --exit-code 4802b788c37fa4fcf8f8336caa412953aeeef249 HEAD -- app sharedUi shared
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Focused artist and album regression
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests "com.music.bitchord.ui.screens.NativeArtistBackdropAvailabilityTest" --tests "com.music.bitchord.ui.screens.NativeCanonicalAlbumArtworkTest" --tests "com.music.bitchord.ui.screens.NativeAlbumDetailScrollStateTest"
      - name: Android full unit suite
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI JVM
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Shared Automix regression
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :shared:jvmTest --tests "com.music.bitchord.playback.smart.AdvancedAutomixPlannerTest"
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-artist-backdrop-failures-${{ github.sha }}
          path: |
            app/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
