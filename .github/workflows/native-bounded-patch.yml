name: Native bounded patch

on:
  push:
    branches: [playback/canonical-remote-direct-play]
    paths:
      - '.github/workflows/native-bounded-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run canonical remote integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback/canonical-remote-direct-play
          fetch-depth: 0

      - name: Apply bounded integration patch
        run: python3 .native-patch/apply.py

      - name: Remove temporary patch machinery
        run: rm -f .native-patch/apply.py .github/workflows/native-bounded-patch.yml

      - name: Verify diff
        run: git diff --check

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire provider-owned canonical remote direct play'
          git push origin HEAD:playback/canonical-remote-direct-play
