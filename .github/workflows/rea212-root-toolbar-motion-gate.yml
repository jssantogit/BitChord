name: REA 212 · Root toolbar motion gate
on:
  push:
    branches:
      - validation/rea212-root-toolbar-motion-20261113
permissions:
  contents: read
jobs:
  android-tests:
    name: Android + shared UI regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout pinned Android PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Assert tested application matches PR
        run: git diff --exit-code e3a837e951e71a243cf13fd246959b91bc86fe8d HEAD -- app sharedUi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure unit-test environment
        run: |
          printf 'LASTFM_API_KEY=%s\n' "" > local.properties
          printf 'LASTFM_SECRET=%s\n' "" >> local.properties
          chmod +x gradlew
      - name: Android regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
