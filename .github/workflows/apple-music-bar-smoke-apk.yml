name: Apple Music Bottom Bar · Smoke APK

on:
  push:
    branches:
      - validation/rea212-search-smoke-2dc82805-20261113
    paths:
      - .github/workflows/apple-music-bar-smoke-apk.yml
  # No APK on every PR update. Explicitly apply the 'apple-music-smoke' label
  # to this experiment's PR when a new smoke build is requested.
  pull_request:
    types: [labeled]

# This workflow exists only on the experimental PR branch.
# It is not a release pipeline and does not publish a signed production app.
permissions:
  contents: read

concurrency:
  group: apple-music-bottom-bar-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dev-debug-apk:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/validation/rea212-search-smoke-2dc82805-20261113') || (github.event_name == 'pull_request' && github.event.pull_request.number == 212 && github.head_ref == 'experiment/apple-music-bottom-bar-pr209-20261108' && github.event.label.name == 'apple-music-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2dc828058fa1f17be4bd2ee18019e3ab998052ea
      - name: Assert exact PR 212 source
        run: test "$(git rev-parse HEAD)" = "2dc828058fa1f17be4bd2ee18019e3ab998052ea"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure local build properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
      - name: Assemble Android devDebug
        run: |
          chmod +x gradlew
          ./gradlew --build-cache -Pbitchord.bundleWear=false :app:assembleDevDebug
      - name: Select universal APK and record checksum
        run: |
          set -euo pipefail
          mkdir -p smoke-apk
          find app/build/outputs/apk/dev/debug -maxdepth 1 -name '*.apk' -type f -print
          universal="$(find app/build/outputs/apk/dev/debug -maxdepth 1 -name '*universal*.apk' -type f -print -quit)"
          if [[ -z "$universal" ]]; then
            echo "Universal APK was not generated." >&2
            exit 1
          fi
          cp "$universal" smoke-apk/BitChord-AppleMusicBar-devDebug-universal.apk
          sha256sum smoke-apk/*.apk | tee smoke-apk/SHA256SUMS.txt
      - name: Upload experiment APK
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-bar-devDebug-2dc828058fa1f17be4bd2ee18019e3ab998052ea
          path: smoke-apk/
          retention-days: 7
          if-no-files-found: error
