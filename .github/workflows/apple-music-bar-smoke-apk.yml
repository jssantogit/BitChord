name: Apple Music Bottom Bar · Smoke APK

on:
  pull_request:
    types: [opened, reopened, synchronize]

# This workflow exists only on the experimental PR branch.
# It is not a release pipeline and does not publish a signed production app.
permissions:
  contents: read

concurrency:
  group: apple-music-bottom-bar-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dev-debug-apk:
    if: github.event.pull_request.number == 212 && github.head_ref == 'experiment/apple-music-bottom-bar-pr209-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure local build properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
      - name: Assemble Android devDebug
        run: |
          chmod +x gradlew
          ./gradlew --build-cache -Pbitchord.bundleWear=false :app:assembleDevDebug
      - name: Select universal APK and record checksum
        run: |
          set -euo pipefail
          mkdir -p smoke-apk
          find app/build/outputs/apk/dev/debug -maxdepth 1 -name '*.apk' -type f -print
          universal="$(find app/build/outputs/apk/dev/debug -maxdepth 1 -name '*universal*.apk' -type f -print -quit)"
          if [[ -z "$universal" ]]; then
            echo "Universal APK was not generated." >&2
            exit 1
          fi
          cp "$universal" smoke-apk/BitChord-AppleMusicBar-devDebug-universal.apk
          sha256sum smoke-apk/*.apk | tee smoke-apk/SHA256SUMS.txt
      - name: Upload experiment APK
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-bar-devDebug-${{ github.event.pull_request.head.sha }}
          path: smoke-apk/
          retention-days: 7
          if-no-files-found: error
