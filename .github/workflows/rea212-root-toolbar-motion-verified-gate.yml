name: REA 212 · Root toolbar motion verified gate
on:
  push:
    branches:
      - validation/rea212-root-toolbar-motion-fix-20261113
permissions:
  contents: read
jobs:
  android-tests:
    name: Android + shared UI regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Assert exact Android source
        run: git diff --exit-code f3bf4eb798cc8290845e46f9eacf2e1ac7b10507 HEAD -- app sharedUi
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Unit-test settings
        run: |
          printf 'LASTFM_API_KEY=%s\n' "" > local.properties
          printf 'LASTFM_SECRET=%s\n' "" >> local.properties
          chmod +x gradlew
      - name: Android app full unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI JVM tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
