# Isolated unit coverage of the exact Apple saved-filter held-menu source.
# No APK, merge or release.
name: REA 212 · Saved-filter held context menu tests

on:
  push:
    branches: [validation/rea212-savedfilter-592c3212-20261113]
    paths: [.github/workflows/rea212-savedfilter-held-test-only.yml]

permissions:
  contents: read

jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR 212 SHA
        uses: actions/checkout@v4
        with:
          ref: 592c321298f804d4bd266d9138c363443b9c5e51
      - name: Confirm exact source
        run: test "$(git rev-parse HEAD)" = "592c321298f804d4bd266d9138c363443b9c5e51"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure unit tests
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Android app unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared native UI regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Retain failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-savedfilter-failure-reports
          path: app/build/reports/tests/
          retention-days: 3
          if-no-files-found: ignore
