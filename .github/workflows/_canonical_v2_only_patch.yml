name: Canonical queue v2-only patch

on:
  push:
    branches:
      - playback/canonical-queue-persistence
    paths:
      - .github/workflows/_canonical_v2_only_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback/canonical-queue-persistence
          fetch-depth: 0
      - name: Make v1 read-only compatibility
        shell: python
        run: |
          from pathlib import Path

          persistence = Path('app/src/main/java/com/music/bitchord/playback/BoundedContextPersistence.kt')
          text = persistence.read_text()
          old = '''        CanonicalQueueSnapshotCodec.encode(state)
              ?: json.encodeToString(StoredState.serializer(), state.toStored())'''
          new = '''        CanonicalQueueSnapshotCodec.encode(state)
              ?: error("canonical queue v2 encoding failed")'''
          if old not in text:
              raise SystemExit('production encode fallback anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''    /** Visible to JVM tests and used by [load] for defensive validation. */
              internal fun decode(raw: String): State? {'''
          helper = '''    /** Historical v1 fixture writer for compatibility tests only. Production never calls this. */
              internal fun encodeLegacySnapshotForTesting(state: State): String? = runCatching {
                  require(validateState(state) != null) { "invalid bounded context state" }
                  json.encodeToString(StoredState.serializer(), state.toStored())
              }.getOrNull()

              /** Visible to JVM tests and used by [load] for defensive validation. */
              internal fun decode(raw: String): State? {'''
          if anchor not in text:
              raise SystemExit('decode anchor not found')
          text = text.replace(anchor, helper, 1)
          persistence.write_text(text)

          tests = Path('app/src/test/java/com/music/bitchord/playback/CanonicalQueuePersistenceV2Test.kt')
          text = tests.read_text()
          start_marker = '    @Test\n    fun `pure legacy snapshot remains schema one and readable`() {'
          start = text.index(start_marker)
          next_helper = text.index('\n    private fun state(', start)
          replacement = '''    @Test
              fun `new unmapped legacy snapshot still writes schema two without sourceKey`() {
                  val source = QueueSource("Legacy", PlaybackSourceType.BROWSE, "legacy")
                  val legacy = song(id = "legacy-video-id", source = source, entryId = "legacy-entry")
                  val state = state(
                      source = source,
                      contextSongs = listOf(legacy.copy(queueEntryId = null)),
                      entries = listOf(BoundedContextPersistence.Entry(legacy, 0, 0L)),
                      currentIndex = 0,
                      positionMs = 222L,
                      identities = emptyList(),
                  )

                  val raw = requireNotNull(BoundedContextPersistence.encode(state))
                  val decoded = requireNotNull(BoundedContextPersistence.decode(raw))

                  assertTrue(raw.contains("\\\"schemaVersion\\\":2"))
                  assertFalse(raw.contains("sourceKey"))
                  assertTrue(raw.contains("legacy-video-id"))
                  assertEquals("legacy-video-id", decoded.entries.single().song.videoId)
                  assertEquals(222L, decoded.positionMs)
              }

              @Test
              fun `historical schema one snapshot remains readable`() {
                  val source = QueueSource("Legacy", PlaybackSourceType.BROWSE, "legacy")
                  val legacy = song(id = "legacy-video-id", source = source, entryId = "legacy-entry")
                  val state = state(
                      source = source,
                      contextSongs = listOf(legacy.copy(queueEntryId = null)),
                      entries = listOf(BoundedContextPersistence.Entry(legacy, 0, 0L)),
                      currentIndex = 0,
                      positionMs = 333L,
                      identities = emptyList(),
                  )

                  val historical = requireNotNull(
                      BoundedContextPersistence.encodeLegacySnapshotForTesting(state),
                  )
                  val decoded = requireNotNull(BoundedContextPersistence.decode(historical))

                  assertTrue(historical.contains("\\\"schemaVersion\\\":1"))
                  assertTrue(historical.contains("sourceKey"))
                  assertEquals("legacy-video-id", decoded.entries.single().song.videoId)
                  assertEquals(333L, decoded.positionMs)
              }
          '''
          text = text[:start] + replacement + text[next_helper:]
          tests.write_text(text)
      - name: Self-remove workflow and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_canonical_v2_only_patch.yml
          git add app/src/main/java/com/music/bitchord/playback/BoundedContextPersistence.kt app/src/test/java/com/music/bitchord/playback/CanonicalQueuePersistenceV2Test.kt
          git commit -m "fix: keep schema v1 read-only"
          git push origin HEAD:playback/canonical-queue-persistence
