name: Acquisition — Soulseek live selection
# Only explicitly trusted internal branch pushes or manual dispatch; never fork PRs.
on:
  workflow_dispatch:
    inputs:
      corpus:
        description: 'Frozen corpus'
        type: choice
        options: [kpop1, mixed2, mixed3, batch123, pending123]
        default: kpop1
      cases:
        description: 'Comma-separated frozen corpus IDs; empty means all 30'
        type: string
        default: ''
  push:
    branches: [integration/soulseek-publication-20261128]
    paths:
      - '.github/workflows/acquisition-live-selection.yml'
      - 'scripts/acquisition_live_selection.sh'
      - 'scripts/acquisition_live_install.sh'
      - 'scripts/acquisition_live_corpora.sh'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0AutoCandidateSelectionPolicy.kt'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0AutoDiscoveryCoordinator.kt'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0CandidateRank.kt'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0FreshAutoSearchTransport.kt'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0SoulseekSearchResponseParser.kt'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0IndirectSearchWire.kt'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0SearchTicketRegistry.kt'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0MultiSearchCandidateEvidence.kt'
      - 'app/src/test/java/com/music/aria/acquisition/a0/A0MultiSearchCandidateEvidenceTest.kt'
      - 'app/src/test/java/com/music/aria/acquisition/a0/A0SearchTicketRegistryTest.kt'
      - 'app/src/main/java/com/music/aria/acquisition/a0/A0SearchRecoveryPlan.kt'
      - 'app/src/test/java/com/music/aria/acquisition/a0/A0SearchRecoveryPlanTest.kt'
      - 'app/src/test/java/com/music/aria/acquisition/a0/A0CandidateRankEditionAliasTest.kt'
      - 'app/src/androidTest/java/com/music/aria/acquisition/live/SoulseekLiveSelectionTest.kt'
permissions:
  contents: read
concurrency:
  group: acquisition-soulseek-ci-account
  cancel-in-progress: false
jobs:
  selection:
    if: github.repository == 'jssantogit/Aria'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build focused devDebug APKs without account secrets
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDevDebug :app:assembleDevDebugAndroidTest
      - name: Verify ranking regression contracts
        run: ./gradlew --no-daemon :app:testDevDebugUnitTest --tests 'com.music.aria.acquisition.a0.A0CandidateRank*Test' --tests 'com.music.aria.acquisition.a0.A0AutoCandidateSelectionPolicyTest' --tests 'com.music.aria.acquisition.a0.A0SearchRecoveryPlanTest' --tests 'com.music.aria.acquisition.a0.A0SoulseekSearchResponseParserTest' --tests 'com.music.aria.acquisition.a0.A0IndirectSearchWireTest' --tests 'com.music.aria.acquisition.a0.A0SearchTicketRegistryTest' --tests 'com.music.aria.acquisition.a0.A0MultiSearchCandidateEvidenceTest'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Read-only live discovery and selection
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          # Push rechecks the 12 unresolved cases; manual batch123 retains full mixed runs.
          # All network sessions remain exclusive to the dedicated account.
          ARIA_LIVE_CASES: ${{ github.event_name == 'push' && '' || inputs.cases }}
          ARIA_LIVE_CORPUS: ${{ github.event_name == 'push' && 'pending123' || inputs.corpus }}
          # Requested calibration audit: sanitized basenames only; explicit false disables.
          ARIA_LIVE_NAMES: ${{ vars.SOULSEEK_LIVE_EXPORT_FILENAMES != 'false' && 'true' || 'false' }}
          SLSK_USER: ${{ secrets.SOULSEEK_CI_USERNAME || secrets.SOULSEEK_USERNAME || secrets.SOULSEEK_USER }}
          SLSK_PASS: ${{ secrets.SOULSEEK_CI_PASSWORD || secrets.SOULSEEK_PASSWORD || secrets.SOULSEEK_PASS }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/acquisition_live_corpora.sh
      - name: Upload aggregate-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-live-selection-${{ github.run_id }}
          path: |
            acquisition-live-results/*/acquisition-live-report.tsv
            acquisition-live-results/*/acquisition-live-search.tsv
            acquisition-live-results/run-status.tsv
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload separate candidate audit (no peer identifiers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-live-candidates-${{ github.run_id }}
          path: acquisition-live-results/*/acquisition-live-candidates.jsonl
          if-no-files-found: ignore
          retention-days: 3
