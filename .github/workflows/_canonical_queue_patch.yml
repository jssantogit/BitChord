name: Canonical queue integration patch
on:
  push:
    branches: [playback/canonical-queue-persistence]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback/canonical-queue-persistence
          fetch-depth: 0
      - name: Patch bounded persistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/music/bitchord/playback/BoundedContextPersistence.kt')
          s = p.read_text()
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('missing pattern: '+old[:100])
              s=s.replace(old,new,1)
          rep('import kotlinx.serialization.json.Json\n', 'import kotlinx.serialization.json.Json\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.runBlocking\n')
          rep('''    data class Entry(\n        val song: Song,\n        val canonicalIndex: Int? = null,\n        val cycleId: Long? = null,\n    )\n''','''    data class Entry(\n        val song: Song,\n        val canonicalIndex: Int? = null,\n        val cycleId: Long? = null,\n        val canonicalIdentity: CanonicalQueueIdentity? = null,\n    )\n''')
          rep('''        val currentIndex: Int,\n        val positionMs: Long,\n    )\n\n    private lateinit var prefs: SharedPreferences\n''','''        val currentIndex: Int,\n        val positionMs: Long,\n        val contextIdentities: List<CanonicalQueueIdentity?> = emptyList(),\n    )\n\n    private lateinit var prefs: SharedPreferences\n    private var canonicalResolver: CanonicalQueueResolver? = null\n''')
          rep('''    fun init(context: Context) {\n        prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)\n    }\n\n    /** Test-only dependency injection; production uses [init]. */\n    @Synchronized\n    internal fun initForTesting(testPrefs: SharedPreferences) {\n        prefs = testPrefs\n        writer = Executor { it.run() }\n    }\n''','''    fun init(context: Context) {\n        val appContext = context.applicationContext\n        prefs = appContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)\n        canonicalResolver = androidCanonicalQueueResolver(appContext)\n    }\n\n    /** Test-only dependency injection; production uses [init]. */\n    @Synchronized\n    internal fun initForTesting(\n        testPrefs: SharedPreferences,\n        testResolver: CanonicalQueueResolver? = null,\n    ) {\n        prefs = testPrefs\n        canonicalResolver = testResolver\n        writer = Executor { it.run() }\n    }\n''')
          rep('''    private fun flushPending() {\n        val (state, startedAt) = synchronized(this) {\n            val next = pending ?: return\n            pending = null\n            next to generation\n        }\n        val encoded = encode(state) ?: return\n''','''    private fun flushPending() {\n        val (rawState, startedAt) = synchronized(this) {\n            val next = pending ?: return\n            pending = null\n            next to generation\n        }\n        val state = canonicalizeForPersistence(rawState)\n        val encoded = encode(state) ?: return\n''')
          rep('''    fun saveImmediately(state: State) {\n        synchronized(this) {\n            generation += 1\n            pending = null\n        }\n        val encoded = encode(state) ?: return\n''','''    fun saveImmediately(rawState: State) {\n        synchronized(this) {\n            generation += 1\n            pending = null\n        }\n        val state = canonicalizeForPersistence(rawState)\n        val encoded = encode(state) ?: return\n''')
          rep('''        val raw = runCatching { prefs.getString(KEY_STATE, null) }.getOrNull() ?: return null\n        val state = decode(raw) ?: return null\n        val currentEntryId = state.entries[state.currentIndex].song.queueEntryId\n''','''        val raw = runCatching { prefs.getString(KEY_STATE, null) }.getOrNull() ?: return null\n        val decoded = decode(raw) ?: return null\n        val state = rehydrateAfterLoad(decoded) ?: return null\n        val currentEntryId = state.entries[state.currentIndex].song.queueEntryId\n''')
          rep('''    /** Visible to JVM tests; the Android wrapper above remains the only writer. */\n    internal fun encode(state: State): String? = runCatching {\n        require(validateState(state) != null) { "invalid bounded context state" }\n        json.encodeToString(StoredState.serializer(), state.toStored())\n    }.getOrNull()?.takeIf {\n''','''    private fun canonicalizeForPersistence(state: State): State {\n        val resolver = canonicalResolver ?: return state\n        return runCatching { runBlocking(Dispatchers.IO) { CanonicalQueueMigration.canonicalize(state, resolver) } }\n            .getOrDefault(state)\n    }\n\n    private fun rehydrateAfterLoad(state: State): State? {\n        if (state.contextIdentities.isEmpty() && state.entries.none { it.canonicalIdentity != null }) return state\n        val resolver = canonicalResolver ?: return null\n        return runCatching { runBlocking(Dispatchers.IO) { CanonicalQueueMigration.rehydrate(state, resolver) } }\n            .getOrNull()\n    }\n\n    /** Visible to JVM tests; the Android wrapper above remains the only writer. */\n    internal fun encode(state: State): String? = runCatching {\n        require(validateState(state) != null) { "invalid bounded context state" }\n        CanonicalQueueSnapshotCodec.encode(state)\n            ?: json.encodeToString(StoredState.serializer(), state.toStored())\n    }.getOrNull()?.takeIf {\n''')
          rep('''        return runCatching {\n            json.decodeFromString<StoredState>(raw).toState()\n        }.getOrNull()\n''','''        CanonicalQueueSnapshotCodec.decode(raw)?.let { canonical ->\n            return canonical.takeIf { validateState(it) != null }\n        }\n        return runCatching {\n            json.decodeFromString<StoredState>(raw).toState()\n        }.getOrNull()\n''')
          rep('''                    canonicalIndex = logicalEntry.canonicalIndex,\n                    cycleId = logicalEntry.cycleId,\n                )\n''','''                    canonicalIndex = logicalEntry.canonicalIndex,\n                    cycleId = logicalEntry.cycleId,\n                    canonicalIdentity = matching?.canonicalIdentity\n                        ?: state.contextIdentities.getOrNull(logicalEntry.canonicalIndex),\n                )\n''')
          rep('''        val canonical = context.songs\n        if (canonical.isEmpty() || canonical.size > MAX_CANONICAL_SONGS) return null\n''','''        val canonical = context.songs\n        if (canonical.isEmpty() || canonical.size > MAX_CANONICAL_SONGS) return null\n        if (state.contextIdentities.isNotEmpty() && state.contextIdentities.size != canonical.size) return null\n''')
          rep('''                val expected = canonical[canonicalIndex]\n                if (entry.song.contextEntryKey() != expected.contextEntryKey()) return null\n''','''                val expected = canonical[canonicalIndex]\n                if (entry.song.contextEntryKey() != expected.contextEntryKey()) return null\n                val contextIdentity = state.contextIdentities.getOrNull(canonicalIndex)\n                if (entry.canonicalIdentity != null && contextIdentity != null && entry.canonicalIdentity != contextIdentity) return null\n''')
          p.write_text(s)
          PY
      - name: Update v2 contract test
        shell: bash
        run: |
          cat > app/src/test/java/com/music/bitchord/playback/CanonicalQueuePersistenceV2Test.kt <<'EOF'
          package com.music.bitchord.playback

          import com.music.bitchord.data.model.PlaybackSourceType
          import com.music.bitchord.data.model.QueueTier
          import com.music.bitchord.data.model.Song
          import org.junit.Assert.*
          import org.junit.Test

          class CanonicalQueuePersistenceV2Test {
              @Test fun `canonical snapshot omits transport and source identity`() {
                  val source = QueueSource("Mixed queue", PlaybackSourceType.BROWSE, "mixed")
                  val song = Song(videoId="legacy-video", title="Track", artist="Artist", thumbnailUrl=null,
                      localUri="content://secret/42", localPath="/secret/Track.flac", queueTier=QueueTier.CONTEXT,
                      queueEntryId="entry", playbackSource=source.title, playbackSourceType=source.type, playbackSourceId=source.id)
                  val identity = CanonicalQueueIdentity("recording-1", "asset-1", RoomCanonicalQueueResolver.LOCAL_PROVIDER)
                  val state = BoundedContextPersistence.State(
                      ContextSnapshot("context-token", "${source.type.name}:${source.id}", source.id,
                          listOf(song.copy(queueEntryId=null)), 1L, null, ContinuationState.EXHAUSTED),
                      source, QueueWindow(1).startAt(0).snapshot(),
                      listOf(BoundedContextPersistence.Entry(song,0,0L,identity)), 0, 12345L, listOf(identity))
                  val raw = requireNotNull(BoundedContextPersistence.encode(state))
                  assertTrue(raw.contains("\"schemaVersion\":2"))
                  listOf("sourceKey","legacy-video","content://secret/42","/secret/Track.flac","sessionId").forEach { assertFalse(raw.contains(it)) }
                  assertTrue(raw.contains("recording-1")); assertTrue(raw.contains("asset-1")); assertTrue(raw.contains("local-mediastore"))
                  val decoded = requireNotNull(BoundedContextPersistence.decode(raw))
                  assertEquals(12345L, decoded.positionMs); assertEquals(0, decoded.currentIndex)
                  assertEquals(identity, decoded.entries.single().canonicalIdentity)
              }

              @Test fun `remote canonical snapshot restores only logical uri without account access`() {
                  val request = CanonicalRemotePlaybackRequest("recording-r","asset-r","opensubsonic:account")
                  val logical = CanonicalRemotePlaybackUri.encode(request)
                  val source = QueueSource("Remote", PlaybackSourceType.BROWSE, "remote")
                  val song = Song(videoId="recording-r", title="Remote", artist="Artist", thumbnailUrl=null,
                      localUri=logical, queueTier=QueueTier.CONTEXT, queueEntryId="remote-entry",
                      playbackSource=source.title, playbackSourceType=source.type, playbackSourceId=source.id)
                  val identity = CanonicalQueueIdentity(request.recordingId, request.mediaAssetId, request.providerKey)
                  val state = BoundedContextPersistence.State(
                      ContextSnapshot("remote-token","${source.type.name}:${source.id}",source.id,listOf(song.copy(queueEntryId=null)),0L,null,ContinuationState.EXHAUSTED),
                      source, QueueWindow(1).startAt(0).snapshot(), listOf(BoundedContextPersistence.Entry(song,0,0L,identity)),0,900L,listOf(identity))
                  val raw=requireNotNull(BoundedContextPersistence.encode(state))
                  assertFalse(raw.contains(logical)); assertFalse(raw.contains("videoId")); assertFalse(raw.contains("sourceKey"))
                  val decoded=requireNotNull(BoundedContextPersistence.decode(raw))
                  val resolver=object: CanonicalQueueResolver {
                      override suspend fun identifyAll(songs: List<Song>) = error("restore must not identify")
                      override suspend fun resolveAll(ids: List<CanonicalQueueIdentity?>) = ids.map { id -> id?.let {
                          val req=CanonicalRemotePlaybackRequest(it.recordingId,requireNotNull(it.mediaAssetId),requireNotNull(it.providerKey))
                          CanonicalPlayableAsset(it,CanonicalRemotePlaybackUri.encode(req))
                      }}
                  }
                  val restored=requireNotNull(kotlinx.coroutines.runBlocking { CanonicalQueueMigration.rehydrate(decoded,resolver) })
                  assertEquals(logical,restored.entries.single().song.localUri)
                  assertTrue(CanonicalRemotePlaybackUri.isCanonical(requireNotNull(restored.entries.single().song.localUri)))
              }
          }
          EOF
      - name: Self-remove workflow and push
        shell: bash
        run: |
          rm .github/workflows/_canonical_queue_patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main app/src/test .github/workflows/_canonical_queue_patch.yml
          git commit -m "feat: persist canonical queue identity"
          git push origin HEAD:playback/canonical-queue-persistence
