name: Acquisition A0 Android Emulator Smoke

# Non-required on-device test coverage. #63 remains opt-in; #173 runs on PR synchronize.
# Uses synthetic local fixtures only; no Soulseek credentials or real peers.
# workflow_dispatch becomes directly runnable after this workflow reaches main.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: acquisition-a0-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  emulator:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ci:acquisition-emulator' &&
       github.event.pull_request.number == 63 &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'synchronize' &&
       github.event.pull_request.number == 173 &&
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Soulseek synthetic emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34, 36]
    steps:
      - name: Checkout A0 branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Use empty third-party test credentials
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew

      - name: Enable KVM for accelerated Linux emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pinned ReactiveCircus android-emulator-runner v2.38.0.
      - name: Instrumented A0 APK/loopback/storage smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # All instrumentation tests in acquisition.a0, including account, SAF and
          # owned offline MediaStore fixture. No live Soulseek server contacted.
          script: ./gradlew --no-daemon --build-cache -Pbitchord.bundleWear=false -Pandroid.testInstrumentationRunnerArguments.package=com.music.bitchord.acquisition.a0 :app:connectedDevDebugAndroidTest

      - name: Upload focused instrumentation reports (no bugreport)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-emulator-api-${{ matrix.api-level }}-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 3
