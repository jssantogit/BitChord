name: Integration Queue Tests

on:
  pull_request:
    paths:
      - 'tools/integration_queue.py'
      - 'tools/delivery_metrics.py'
      - 'tools/delivery_planner.py'
      - 'tools/delivery_preflight.py'
      - 'tools/delivery_journal.py'
      - 'tools/delivery_reconcile.py'
      - 'tools/delivery_snapshot.py'
      - 'tests/test_delivery_snapshot.py'
      - 'tests/test_delivery_cli.py'
      - 'tests/test_delivery_planner.py'
      - 'tests/test_delivery_preflight.py'
      - 'tests/test_delivery_journal.py'
      - 'tests/test_delivery_reconcile.py'
      - 'tests/test_delivery_metrics.py'
      - 'tests/test_integration_queue.py'
      - 'tests/test_android_ci_queue.py'
      - 'tests/test_workflow_security.py'
      - '.github/workflows/close-issue.yml'
      - '.github/workflows/update-contributors.yml'
      - '.github/workflows/check.yml'
      - '.github/workflows/integration-queue.yml'
      - '.github/workflows/integration-queue-tests.yml'
      - '.github/integration-batches/**'
      - 'docs/integration-queue.md'
  push:
    branches: [main]
    paths:
      - 'tools/integration_queue.py'
      - 'tools/delivery_metrics.py'
      - 'tools/delivery_planner.py'
      - 'tools/delivery_preflight.py'
      - 'tools/delivery_journal.py'
      - 'tools/delivery_reconcile.py'
      - 'tools/delivery_snapshot.py'
      - 'tests/test_delivery_snapshot.py'
      - 'tests/test_delivery_cli.py'
      - 'tests/test_delivery_planner.py'
      - 'tests/test_delivery_preflight.py'
      - 'tests/test_delivery_journal.py'
      - 'tests/test_delivery_reconcile.py'
      - 'tests/test_delivery_metrics.py'
      - 'tests/test_integration_queue.py'
      - 'tests/test_android_ci_queue.py'
      - 'tests/test_workflow_security.py'
      - '.github/workflows/close-issue.yml'
      - '.github/workflows/update-contributors.yml'
      - '.github/workflows/check.yml'
      - '.github/workflows/integration-queue.yml'
      - '.github/workflows/integration-queue-tests.yml'
      - '.github/integration-batches/**'
      - 'docs/integration-queue.md'

permissions:
  contents: read

jobs:
  unit:
    name: Integration queue · contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
