name: "Catalog #211 — A-type source lead scouting"

# A-type source lead scouting after B sample completion. Does not
# adjudicate A cases, alter type authority, authenticate or build APK/smoke.
on:
  push:
    branches:
      - catalog/210-discogs-provider-evidence-20261107
    paths:
      - scripts/catalog_211_discogs_master_lead_scout.py
      - scripts/test_catalog_211_discogs_master_lead_scout.py
      - scripts/test_catalog_211_discogs_exact_release_link_probe.py
      - scripts/catalog_211_discogs_exact_release_link_probe.py
      - scripts/catalog_211_discogs_master_versions_probe.py
      - docs/plans/catalog-211-discogs-corpus-manifest.json
      - .github/workflows/catalog-211-discogs-master-leads.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-211-master-leads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-master-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test strict artist credit, typed URL, shared Master and budget controls
        run: python3 -m unittest discover -s scripts -p 'test_catalog_211_discogs_master_lead_scout.py' -v
      - name: Test exact-Release link evidence without assuming Master equivalence
        run: python3 -m unittest discover -s scripts -p 'test_catalog_211_discogs_exact_release_link_probe.py' -v
      - name: Research eight artist-balanced typed Masters for A type controls
        run: python3 scripts/catalog_211_discogs_master_lead_scout.py --scope A
      - name: Trace exact MusicBrainz Release to Discogs Release links inside large Masters
        run: python3 scripts/catalog_211_discogs_exact_release_link_probe.py
      - name: Preserve discovery evidence, never adjudicate B cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discogs-211-a-type-source-master-leads
          path: |
            discogs-211-master-lead-scout.json
            discogs-211-exact-release-link-probe.json
          if-no-files-found: warn
          retention-days: 7
