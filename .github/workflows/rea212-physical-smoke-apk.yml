# User-authorized physical smoke of PR #212. SOURCE SHA MUST NOT FLOAT.
# The isolated branch only starts GitHub Actions; production/PR code is unmodified.
name: REA 212 · Apple Music UI physical smoke APK

on:
  push:
    branches:
      - validation/rea212-physical-smoke-apk-50a9de16-20261113
    paths:
      - .github/workflows/rea212-physical-smoke-apk.yml

permissions:
  contents: read

jobs:
  build-universal-dev-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR 212 source
        uses: actions/checkout@v4
        with:
          ref: 50a9de16667349c6b538b23611b1aeb9a4ade52f
      - name: Assert exact source commit
        run: test "$(git rev-parse HEAD)" = "50a9de16667349c6b538b23611b1aeb9a4ade52f"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure local properties
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Assemble devDebug APK
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:assembleDevDebug
      - name: Select universal APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-apk
          find app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*.apk' -print
          universal="$(find app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          if [[ -z "$universal" ]]; then
            echo "::error::Missing universal devDebug APK" >&2
            exit 1
          fi
          cp "$universal" smoke-apk/BitChord-REA212-50a9de16-devDebug-universal.apk
          (cd smoke-apk && sha256sum *.apk > SHA256SUMS.txt)
          cat smoke-apk/SHA256SUMS.txt
      - name: Upload universal smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-REA212-50a9de16-devDebug-universal
          path: smoke-apk/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-50a9de16-apk-build-failure
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 3
