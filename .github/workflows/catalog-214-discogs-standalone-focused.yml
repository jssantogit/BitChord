name: "Catalog #214 — Focused Discogs standalone Android"

on:
  push:
    branches:
      - catalog/214-discogs-independent-catalog-20261113
    paths:
      - app/src/main/java/com/music/bitchord/data/catalog/metadata/discogs/DiscogsStandaloneCatalog.kt
      - app/src/test/java/com/music/bitchord/DiscogsStandaloneCatalogTest.kt
      - .github/workflows/catalog-214-discogs-standalone-focused.yml
  workflow_dispatch:

concurrency:
  group: catalog-214-standalone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-jvm:
    name: Discogs standalone + artist scroll · Android JVM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile app and run focused regressions
        run: >-
          ./gradlew --build-cache -Pbitchord.bundleWear=false
          :app:testDevDebugUnitTest
          --tests 'com.music.bitchord.DiscogsStandaloneCatalogTest'
          --tests 'com.music.bitchord.DiscogsEditorialArtistShelvesTest'
      - name: Preserve focused failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: discogs-214-standalone-failure-${{ github.sha }}
          path: app/build/reports/tests/testDevDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3
