name: REA212 Android Held and Player Menu Final Gate
on:
  push:
    branches:
      - validation/rea212-menus-with-player-20261113
permissions:
  contents: read
jobs:
  android-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source code to pull request
        run: git diff --exit-code 136430db1de22bc77209a53a2344459091285913 HEAD -- app sharedUi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android build
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Focused Android context menu regressions
        run: ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests com.music.bitchord.ui.components.HeldContextMenuPlateTest --tests com.music.bitchord.ui.screens.CanonicalRecentHeldActionsComposeTest --tests com.music.bitchord.ui.screens.CanonicalLibraryHeldContextMenuPolicyTest
      - name: Complete Android unit suite
        run: ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Complete shared UI JVM suite
        run: ./gradlew -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Android devDebug compilation
        run: ./gradlew -Pbitchord.bundleWear=false :app:compileDevDebugKotlin
