name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# Per-PR workflows supersede old HEADs; main runs are keyed by commit and
# must never be cancelled by newer integration commits.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    # Keep this check context until the main ruleset is migrated separately.
    name: Android · test and build
    # Bounded three-lane PR CI pilot, one running job in each group.
    # A = catalog/intelligence; B = playback; C = all other PR heads.
    # Main remains independent for each exact SHA, never cross-cancelling.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'catalog/') || startsWith(github.head_ref, 'intelligence/')) && 'bitchord-android-pr-lane-a' || github.event_name == 'pull_request' && startsWith(github.head_ref, 'playback/') && 'bitchord-android-pr-lane-b' || github.event_name == 'pull_request' && 'bitchord-android-pr-lane-c' || format('bitchord-android-main-{0}', github.sha) }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Verify Soulseek offline benchmark (stdlib only)
        run: python3 -m unittest discover -s tools/benchmarks/soulseek -p 'test_*.py' -v

      - name: Run Android unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest

      # This file contains only opaque offer IDs and input fingerprints:
      # no remote paths, usernames, song names, peer metadata or audio.
      - name: Upload Soulseek synthetic replay evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'acquisition/issue-177-soulseek-discovery'
        uses: actions/upload-artifact@v4
        with:
          name: soulseek-offline-v4-${{ github.sha }}
          path: app/build/benchmark/soulseek/bitchord-preflight-v4.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
