name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android · test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDevDebugUnitTest

      - name: Build dev APK
        run: ./gradlew :app:assembleDevDebug

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-android-dev-debug-${{ github.sha }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
