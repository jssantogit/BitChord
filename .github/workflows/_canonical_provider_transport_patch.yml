name: Temporary canonical provider transport patch

on:
  push:
    branches:
      - playback/canonical-remote-direct-play
    paths:
      - .github/workflows/_canonical_provider_transport_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback/canonical-remote-direct-play
          fetch-depth: 0

      - name: Apply bounded PlaybackService integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/music/bitchord/playback/PlaybackService.kt')
          text = path.read_text()

          replacements = [
              (
                  '''import com.music.bitchord.data.catalog.provider.opensubsonic.androidOpenSubsonicMediaAccess\nimport com.music.bitchord.data.catalog.provider.opensubsonic.materializeDataSpec\n''',
                  '''import com.music.bitchord.data.catalog.provider.opensubsonic.androidOpenSubsonicMediaDataSourceFactory\n''',
              ),
              (
                  '''        val canonicalRemoteResolver = CanonicalRemotePlaybackResolver(\n            openSubsonicResolve = androidOpenSubsonicMediaAccess(this)::resolve,\n        )\n\n        val streamResolver = ResolvingDataSource.Resolver { dataSpec ->\n            if (CanonicalRemotePlaybackUri.isCanonical(dataSpec.uri.toString())) {\n                val runtimeRequest = try {\n                    runBlocking {\n                        withTimeout(RESOLVE_TIMEOUT_MS) {\n                            canonicalRemoteResolver.resolve(dataSpec.uri.toString())\n                        }\n                    }\n                } catch (e: TimeoutCancellationException) {\n                    throw java.io.IOException("Canonical remote playback resolution timed out", e)\n                }\n                return@Resolver runtimeRequest.materializeDataSpec(dataSpec)\n            }\n''',
                  '''        val streamResolver = ResolvingDataSource.Resolver { dataSpec ->\n''',
              ),
              (
                  '''            if (CanonicalRemotePlaybackUri.isCanonical(dataSpec.uri.toString())) {\n                // The resolved URI contains ephemeral provider auth. Never hand it\n                // to legacy stream telemetry/cache bookkeeping.\n                streamResolver.resolveDataSpec(dataSpec)\n            } else {\n                streamResolver.resolveDataSpec(dataSpec).also { resolved ->\n                    mediaIdIn(dataSpec.uri)?.let { StreamContainer.served(it, resolved.uri.toString()) }\n                    // The same seam tells the cache whose file it is writing, which\n                    // decides whether the entry outlives the track — see\n                    // [AudioCache.Origin].\n                    AudioCache.recordServed(dataSpec, resolved.uri.toString())\n                }\n            }\n''',
                  '''            streamResolver.resolveDataSpec(dataSpec).also { resolved ->\n                mediaIdIn(dataSpec.uri)?.let { StreamContainer.served(it, resolved.uri.toString()) }\n                // The same seam tells the cache whose file it is writing, which\n                // decides whether the entry outlives the track — see\n                // [AudioCache.Origin].\n                AudioCache.recordServed(dataSpec, resolved.uri.toString())\n            }\n''',
              ),
              (
                  '''        val defaultDataSourceFactory = SmbDataSource.RoutingFactory(\n            DefaultDataSource.Factory(this, resolvingFactory),\n        )\n''',
                  '''        // Canonical remote traffic is intercepted before the generic resolver/chunker.\n        // The provider-owned DataSource is the only component that ever sees the\n        // authenticated OpenSubsonic request.\n        val openSubsonicDataSourceFactory = androidOpenSubsonicMediaDataSourceFactory(this)\n        val canonicalRemoteDataSourceFactory = CanonicalRemoteDataSource.Factory(\n            fallbackFactory = resolvingFactory,\n            openSubsonicFactory = openSubsonicDataSourceFactory::create,\n        )\n        val defaultDataSourceFactory = SmbDataSource.RoutingFactory(\n            DefaultDataSource.Factory(this, canonicalRemoteDataSourceFactory),\n        )\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'bounded replacement expected once, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          workflow = Path('.github/workflows/_canonical_provider_transport_patch.yml')
          workflow.unlink()
          PY

          git diff --check
          git diff -- app/src/main/java/com/music/bitchord/playback/PlaybackService.kt

      - name: Commit bounded integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route canonical stream through provider transport"
          git push origin HEAD:playback/canonical-remote-direct-play
