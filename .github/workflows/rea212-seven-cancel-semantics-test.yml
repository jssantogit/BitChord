# Exact-SHA CI for all seven visual-smoke fixes in draft PR #212.
# Test only, no APK/release or merge.
name: REA 212 · Seven smoke fixes Android and Shared UI

on:
  push:
    branches: [validation/rea212-seven-cancel-semantics-daea32f8-20261113]
    paths: [.github/workflows/rea212-seven-cancel-semantics-test.yml]

permissions:
  contents: read

jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR 212 source
        uses: actions/checkout@v4
        with:
          ref: daea32f8c9407c8aba5186931d18d2a92a959f9f
      - name: Assert pinned source
        run: test "$(git rev-parse HEAD)" = "daea32f8c9407c8aba5186931d18d2a92a959f9f"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure tests
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Android app unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared native UI regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-seven-final-test-reports
          path: app/build/reports/tests/
          retention-days: 3
          if-no-files-found: ignore
