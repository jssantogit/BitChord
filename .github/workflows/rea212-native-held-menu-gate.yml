name: REA 212 - Native held menu regression gate
on:
  push:
    branches:
      - validation/rea212-menu-hold-1477-20261113
permissions:
  contents: read
concurrency:
  group: rea212-menu-hold-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require the exact PR 212 app sources
        run: git diff --exit-code 1477e85fe690d6afcc630a768415364d3faa797c HEAD -- app sharedUi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android tests
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Focused menu and native metadata regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests com.music.bitchord.ui.screens.CanonicalRecentHeldActionsComposeTest --tests com.music.bitchord.ui.screens.NativeArtistPublicTopSectionTest
      - name: Full Android unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI JVM tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
