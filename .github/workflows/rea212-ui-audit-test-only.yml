# Exact-source validation of 7-point smoke findings; no APK or merge.
name: REA 212 · UI regression audit

on:
  push:
    branches: [validation/rea212-ui-audit-61da2504-20261113]
    paths: [.github/workflows/rea212-ui-audit-test-only.yml]

permissions:
  contents: read

jobs:
  app-and-sharedui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR 212 source
        uses: actions/checkout@v4
        with:
          ref: 61da2504969922febdcba29cc0d07585aa443708
      - name: Verify pinned source
        run: test "$(git rev-parse HEAD)" = "61da2504969922febdcba29cc0d07585aa443708"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure unit tests
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=%s\n' "${{ secrets.LASTFM_API_KEY }}" > local.properties
          printf 'LASTFM_SECRET=%s\n' "${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Run Android app unit tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Run shared UI regressions
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Save failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-ui-audit-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
