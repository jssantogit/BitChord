name: Native compile fix

on:
  push:
    branches:
      - playback/canonical-remote-direct-play
    paths:
      - .github/workflows/native-compile-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback/canonical-remote-direct-play
          fetch-depth: 0

      - name: Apply bounded compile fix
        run: python3 .native-patch/fix-compile.py

      - name: Remove temporary patch machinery
        run: rm -f .native-patch/fix-compile.py .github/workflows/native-compile-fix.yml

      - name: Verify diff
        run: git diff --check

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use canonical browse asset for remote playback'
          git push origin HEAD:playback/canonical-remote-direct-play
