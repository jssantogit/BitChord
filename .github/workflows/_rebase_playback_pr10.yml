name: Temporary PR10 rebase

on:
  push:
    branches:
      - playback/canonical-remote-direct-play
    paths:
      - .github/workflows/_rebase_playback_pr10.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback/canonical-remote-direct-play
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          rm .github/workflows/_rebase_playback_pr10.yml
          git add -A
          git commit -m "chore: remove temporary rebase workflow"
          git push --force-with-lease origin HEAD:playback/canonical-remote-direct-play
