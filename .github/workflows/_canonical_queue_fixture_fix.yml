name: Canonical queue fixture fix

on:
  push:
    branches:
      - playback/canonical-queue-persistence
    paths:
      - .github/workflows/_canonical_queue_fixture_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback/canonical-queue-persistence
          fetch-depth: 0
      - name: Neutralize metadata fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/test/java/com/music/bitchord/playback/CanonicalQueuePersistenceV2Test.kt')
          text = path.read_text()
          old = '        title = "Track $id",'
          if text.count(old) != 1:
              raise SystemExit(f'expected one fixture title, found {text.count(old)}')
          path.write_text(text.replace(old, '        title = "Track",', 1))
      - name: Self-remove workflow and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_canonical_queue_fixture_fix.yml
          git add app/src/test/java/com/music/bitchord/playback/CanonicalQueuePersistenceV2Test.kt
          git commit -m "test: isolate queue transport identifiers from metadata"
          git push origin HEAD:playback/canonical-queue-persistence
