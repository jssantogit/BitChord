name: REA 212 - Menu elevation RED regression
on:
  push:
    branches:
      - validation/rea212-menu-elevation-red-280fb19-20261114
permissions:
  contents: read
jobs:
  native-menu-plate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Source-only verification
        run: git diff --exit-code 280fb1968153756d900694b0211c4cc7620d5984 HEAD -- app sharedUi shared
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Run shared UI plate regression
        run: |
          chmod +x gradlew
          ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest --tests "com.music.bitchord.ui.components.NativeCompactHomePlateStyleTest"
