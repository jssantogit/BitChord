name: Android CI Parallel Workers Pilot

# Non-required PR-only A/B compatibility experiment. Same full Android tests,
# two independent jobs, identical worker cap. No changes to required checks.
on:
  pull_request:
    paths:
      - '.github/workflows/android-ci-parallel-workers-pilot.yml'
      - 'tests/test_ci_parallel_workers_pilot.py'

permissions:
  contents: read

concurrency:
  group: android-ci-parallel-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'infra/android-ci-parallel-workers-pilot-v0'
    name: Android CI pilot · ${{ matrix.mode }} (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [sequential, parallel_two]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (shared cache read-only)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Prepare safe build properties
        run: |
          printf '%s\n' 'LASTFM_API_KEY=ci-placeholder' 'LASTFM_SECRET=ci-placeholder' > local.properties
          chmod +x gradlew

      - name: Validate non-required pilot contract
        run: python3 -m unittest discover -s tests -p test_ci_parallel_workers_pilot.py -v

      - name: Run full Android test suite with controlled worker policy
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            sequential)    flags=(--max-workers=2) ;;
            parallel_two) flags=(--parallel --max-workers=2) ;;
            *) echo 'Unexpected experiment mode'; exit 2 ;;
          esac
          start=$SECONDS
          ./gradlew --build-cache "${flags[@]}" -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
          elapsed=$((SECONDS - start))
          echo "GRADLE_PARALLEL_PILOT_RESULT mode=$MODE gradle_wall_seconds=$elapsed workers=2"
          {
            echo "### Android CI parallel-worker pilot"
            echo "Variant: $MODE"
            echo "Gradle wall time: ${elapsed}s"
            echo "Worker ceiling: 2"
            echo "Full Android unit test suite: passed"
            echo "One run is not proof of a performance gain. Compare cache hits, queue delay, runner capacity and exact SHA."
          } >> "$GITHUB_STEP_SUMMARY"
