name: Failure auto-advance integration patch

on:
  push:
    branches:
      - playback/failure-auto-advance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused PlaybackService patch
        run: python scripts/apply_failure_auto_advance_patch.py
      - name: Commit focused patch
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "PlaybackService already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/playback/PlaybackService.kt
          git commit -m "feat: integrate bounded playback failure auto-advance"
          git push origin HEAD:playback/failure-auto-advance
